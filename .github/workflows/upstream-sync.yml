name: Upstream Sync

on:
  schedule:
    # Bi-weekly (1st and 15th of each month) at 09:00 UTC (5am ET). Exits
    # cleanly when no new upstream release.
    #
    # Checked upstream's (open-webui/open-webui) actual release cadence on
    # 2026-09-25: releases cluster into a handful of patch tags a few days
    # apart, and those clusters land roughly every 3-4 weeks (e.g. v0.9.0
    # 04-21, v0.10.0 06-29, v0.11.0 07-27, v0.11.3 08-31, v0.11.4 09-21).
    # Daily was needless noise for that cadence; cron has no native
    # every-N-weeks interval, so 1st/15th approximates bi-weekly closely
    # enough to keep sync lag low without running (and no-op'ing) most days.
    - cron: '0 9 1,15 * *'
  workflow_dispatch:
    inputs:
      target_tag:
        description: 'Specific upstream tag to sync to (e.g. v0.9.6). Leave blank to auto-detect the latest v* tag.'
        required: false
        type: string
        default: ''
      force:
        description: 'Skip the up-to-date and backward-sync checks'
        required: false
        type: boolean
        default: false

# No special token is needed. GITHUB_TOKEN may push a workflow file only if the
# same path and contents already exist on another branch. The sync keeps `main`
# an exact mirror of upstream, merges (rather than rebases) the tag into flex,
# and sets every workflow file to either flex's or upstream's exact version, so
# that condition always holds. scripts/upstream-sync.sh verify enforces it.
permissions:
  contents: write
  pull-requests: write
  actions: write # disable upstream's workflows on this fork

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      FLEX_REF: origin/flex
      MIRROR_REF: origin/main
      GH_TOKEN: ${{ github.token }}
      # This repo is a fork, and the job adds an `upstream` remote. Without
      # GH_REPO, `gh` resolves the base repo to the PARENT and API calls fail
      # with "Resource not accessible by integration". Pin gh to this fork.
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout flex with full history and tags
        uses: actions/checkout@v6
        with:
          ref: flex
          fetch-depth: 0

      - name: Configure git and fetch upstream tags
        run: |
          git config user.name 'flex-upstream-sync-bot'
          git config user.email 'flex-upstream-sync-bot@users.noreply.github.com'
          git remote add upstream https://github.com/open-webui/open-webui.git
          # --force: this fork's tag history diverges from upstream for some
          # legacy tags (e.g. v0.6.40 points to a different commit). We always
          # want upstream's tag values when resolving the sync target.
          git fetch upstream --tags --prune --force

      - name: Resolve target tag
        id: target
        env:
          INPUT_TAG: ${{ inputs.target_tag }}
        run: |
          if [ -n "${INPUT_TAG}" ]; then
            TARGET="${INPUT_TAG}"
            echo "Using explicit target_tag input: ${TARGET}"
          else
            # Latest upstream release tag, strict semver pattern. Excludes
            # pre-releases (v0.9.6-rc1) and oddball tags.
            TARGET=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | grep -v -- - | head -n 1)
            if [ -z "${TARGET}" ]; then
              echo "::error::No upstream v*.*.* tags found. Did upstream fetch fail?"
              exit 1
            fi
            echo "Auto-detected latest upstream tag: ${TARGET}"
          fi
          echo "target=${TARGET}" >> "$GITHUB_OUTPUT"

      - name: Resolve current base on flex
        id: base
        run: |
          # Most recent upstream release tag that's an ancestor of flex. Flexion's
          # own tags (e.g. v0.9.4-flex.2) are excluded so they can't be mistaken
          # for an upstream base.
          if BASE=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-*' flex 2>/dev/null); then
            echo "flex's most-recent upstream ancestor tag: ${BASE}"
          else
            BASE=""
            echo "::warning::No upstream tag is an ancestor of flex. First-time sync?"
          fi
          echo "base=${BASE}" >> "$GITHUB_OUTPUT"

      - name: Decide whether to sync
        id: decide
        env:
          TARGET: ${{ steps.target.outputs.target }}
          BASE: ${{ steps.base.outputs.base }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ "${TARGET}" = "${BASE}" ] && [ "${FORCE}" != "true" ]; then
            echo "::notice title=Up to date::flex is already on ${TARGET}. Nothing to do."
            echo "sync=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Guard against syncing backward (e.g. an operator-supplied target_tag
          # pointing at a past release).
          #
          # Do NOT use `git merge-base --is-ancestor` here. Upstream does not
          # keep linear tag ancestry: consecutive releases are frequently
          # siblings rather than ancestor/descendant, so an ancestry test can
          # report "not a descendant" for a perfectly valid forward sync. One
          # historical example: upstream v0.9.5 (3660bc00) and v0.9.6
          # (1a97751e) diverged at a shared parent (41b48b54). That bug class
          # broke this workflow for 28 consecutive scheduled runs
          # (2026-06-02 .. 2026-06-29) before this version-comparison guard
          # replaced the ancestry check. If you're re-verifying this comment,
          # don't assume that tag pair is still the most recent instance —
          # spot-check current upstream tags for non-linear ancestry rather
          # than trusting the cited versions as current.
          #
          # Compare release *versions* instead. The zero-padded numeric key
          # orders correctly across component rollovers (v0.9.9 < v0.10.0),
          # which a lexical comparison would get wrong.
          if [ -n "${BASE}" ] && [ "${FORCE}" != "true" ]; then
            ver_key() { printf '%s' "${1#v}" | awk -F. '{printf "%d%03d%03d", $1, $2, $3}'; }
            KEY_BASE=$(ver_key "${BASE}")
            KEY_TARGET=$(ver_key "${TARGET}")
            if [ "${KEY_TARGET}" -lt "${KEY_BASE}" ]; then
              echo "::error::Target ${TARGET} is older than current base ${BASE}. Refusing to sync backward. Pass force=true to override."
              exit 1
            fi
          fi

          echo "Will sync flex from ${BASE:-<none>} → ${TARGET}"
          echo "sync=true" >> "$GITHUB_OUTPUT"

      - name: Make sure main mirrors the target release
        if: steps.decide.outputs.sync == 'true'
        env:
          TARGET: ${{ steps.target.outputs.target }}
        run: |
          # The merge must not push upstream commits or workflow files the repo
          # doesn't already have on a branch, so main has to carry the tag first.
          mirrored() {
            git merge-base --is-ancestor "${TARGET}" "${MIRROR_REF}" \
              && git diff --quiet "${TARGET}" "${MIRROR_REF}" -- .github/workflows
          }
          if mirrored; then
            echo "${MIRROR_REF} already carries ${TARGET}."
            exit 0
          fi

          echo "${MIRROR_REF} does not carry ${TARGET} yet; asking GitHub to sync the fork."
          # GitHub refuses this with GITHUB_TOKEN when upstream changed workflow
          # files, which happens for roughly 40% of releases. A human with write
          # access can do the same sync from the web UI without any special token.
          if ! gh api -X POST "repos/${GITHUB_REPOSITORY}/merge-upstream" -f branch=main; then
            echo "::error title=Sync fork needed::GitHub would not sync main with GITHUB_TOKEN, most likely because upstream changed workflow files. Open ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/tree/main, click 'Sync fork', then re-run this workflow."
            exit 1
          fi

          git fetch origin main
          if ! mirrored; then
            echo "::error title=main does not match ${TARGET}::main was synced but its workflow files or history still don't match ${TARGET}, probably because upstream main has moved past the release. Re-run with target_tag set to the release main is on, or wait for the next release."
            exit 1
          fi

      - name: Disable upstream workflows on this fork
        if: steps.decide.outputs.sync == 'true'
        run: |
          # Upstream's workflow files are kept byte-identical so the push is
          # allowed, which means they are live files here. Keep them from running
          # (they fire on pushes to main, which the mirror receives) by disabling
          # them. A disabled workflow stays disabled when its file changes.
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows" --paginate \
            --jq '.workflows[] | select(.state == "active") | "\(.id) \(.path)"' |
          while read -r id path; do
            case "${path}" in .github/workflows/*) ;; *) continue ;; esac
            scripts/upstream-sync.sh is-flex-workflow "${path}" && continue
            echo "Disabling upstream workflow ${path}"
            gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${id}/disable"
          done

      - name: Create throwaway branch
        if: steps.decide.outputs.sync == 'true'
        id: branch
        env:
          TARGET: ${{ steps.target.outputs.target }}
        run: |
          BRANCH="upstream-sync/${TARGET}-$(date -u +%Y%m%d-%H%M%S)"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          git checkout -b "${BRANCH}"

      - name: Merge target tag with deterministic conflict rules
        if: steps.decide.outputs.sync == 'true'
        id: merge
        env:
          TARGET: ${{ steps.target.outputs.target }}
          OUT_DIR: ${{ runner.temp }}/upstream-sync
        run: |
          scripts/upstream-sync.sh merge "${TARGET}"
          git show --remerge-diff HEAD > "${OUT_DIR}/remerge.diff"
          echo "manual_count=$(grep -c . "${OUT_DIR}/manual-review.txt" || true)" >> "$GITHUB_OUTPUT"

      - name: Verify nothing Flexion-owned was lost
        if: steps.decide.outputs.sync == 'true'
        env:
          TARGET: ${{ steps.target.outputs.target }}
          OUT_DIR: ${{ runner.temp }}/upstream-sync
        run: scripts/upstream-sync.sh verify "${TARGET}"

      - name: Upload sync logs
        if: always() && steps.decide.outputs.sync == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: upstream-sync-${{ steps.target.outputs.target }}
          path: ${{ runner.temp }}/upstream-sync
          if-no-files-found: ignore

      - name: Push throwaway branch and open PR
        if: steps.decide.outputs.sync == 'true'
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
          MANUAL_COUNT: ${{ steps.merge.outputs.manual_count }}
          TARGET: ${{ steps.target.outputs.target }}
          BASE: ${{ steps.base.outputs.base }}
          OUT_DIR: ${{ runner.temp }}/upstream-sync
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git push -u origin "$BRANCH"

          BODY_FILE=$(mktemp)
          cat "${OUT_DIR}/conflict-resolution-log.md" > "$BODY_FILE"

          {
            echo ""
            echo "## Release"
            echo ""
            echo "Merges upstream **${TARGET}** into \`flex\` (previous base: **${BASE:-<none>}**)."
            echo "The conflict resolutions (\`git show --remerge-diff\`) are in the [run's artifact](${RUN_URL})."
            echo ""
            echo "> [!IMPORTANT]"
            echo "> Merge this PR with **Create a merge commit**. Squash or rebase would drop upstream's"
            echo "> history from flex and break the next sync."
            echo ""
            echo "<details><summary>Flexion's changes on top of ${TARGET} after this merge</summary>"
            echo ""
            echo '```'
            git diff --stat=120 "${TARGET}" HEAD | tail -n 200
            echo '```'
            echo ""
            echo "</details>"
            echo ""
          } >> "$BODY_FILE"

          if [ "${MANUAL_COUNT:-0}" -gt 0 ]; then
            {
              echo "## HITL review checklist"
              echo ""
              echo "${MANUAL_COUNT} file(s) need manual resolution. Conflict markers"
              echo "(\`<<<<<<<\`, \`=======\`, \`>>>>>>>\`) are still in the committed content."
              echo ""
              echo "- [ ] Check out this branch, resolve markers, push"
              echo "- [ ] Run \`scripts/upstream-sync.sh verify ${TARGET}\` locally"
              echo "- [ ] Run \`npm run build\` locally"
              echo "- [ ] Run \`docker build .\` locally"
              echo "- [ ] Verify Flexion branding, OAuth flow, and BAG integration still work"
              echo "- [ ] Mark this PR ready for review"
              echo "- [ ] After merge, publish ${TARGET} to ECR via \`publish-flex-image\` workflow"
              echo ""
              echo "<details><summary>Files needing manual review (${MANUAL_COUNT})</summary>"
              echo ""
              echo '```'
              cat "${OUT_DIR}/manual-review.txt"
              echo '```'
              echo ""
              echo "</details>"
            } >> "$BODY_FILE"
            DRAFT_FLAG="--draft"
          else
            {
              echo "## Clean merge"
              echo ""
              echo "All conflicts were resolved by deterministic rules. No manual review needed."
              echo ""
              echo "- [ ] Local smoke check: \`npm run build\`, \`docker build .\`"
              echo "- [ ] Merge"
              echo "- [ ] Publish ${TARGET} to ECR via \`publish-flex-image\` workflow"
            } >> "$BODY_FILE"
            DRAFT_FLAG=""
          fi

          gh pr create $DRAFT_FLAG \
            --base flex \
            --head "$BRANCH" \
            --title "chore: upstream-sync flex onto ${TARGET}" \
            --body-file "$BODY_FILE" \
            --reviewer "flexion/opencode"
