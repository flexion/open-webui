name: Upstream Sync

# Prepares a sync of `flex` onto a new upstream open-webui release and opens a
# DRAFT pull request. It never produces a mergeable result on its own: a human
# resolves the shared-source conflicts, runs the same script locally, and marks
# the PR ready. "Upstream Sync Verify" then re-runs the checks on the PR.
#
# The mechanism lives entirely in scripts/upstream-sync.sh, which is what CI runs
# and what a human runs. A failed CI sync is reproduced locally with:
#
#   git fetch origin && git fetch upstream --tags --prune --force
#   git switch -c upstream-sync/<tag>-local origin/flex
#   scripts/upstream-sync.sh merge <tag>
#   # resolve the files the merge commit lists, commit
#   scripts/upstream-sync.sh verify

on:
  schedule:
    # Weekly, Monday 09:00 UTC (5am ET). Upstream releases arrive in clusters
    # every few weeks, so this bounds sync lag at 7 days while costing ~52
    # no-op runs a year. Re-check the cadence if upstream's release rhythm
    # changes; do not assume this comment is current.
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      target_tag:
        description: 'Upstream tag to sync to (e.g. v0.11.4). Blank = latest upstream v*.*.* release.'
        required: false
        type: string
        default: ''
      force:
        description: 'Skip the up-to-date and backward-sync checks'
        required: false
        type: boolean
        default: false

# Deliberately no `actions: write`: this workflow no longer enables or disables
# anything. `flex` owns .github/workflows outright and keeps upstream's workflow
# files renamed to *.disabled, so a sync never changes that directory and never
# re-activates upstream's release/publish jobs.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      FLEX_REF: origin/flex
      OUT_DIR: ${{ github.workspace }}/.upstream-sync-out
      # SYNC_TOKEN is optional. See "Token" in the sync runbook in
      # README_FLEXION.md: GITHUB_TOKEN is expected to be enough because the
      # pushed branch changes no workflow file, but that has not been proven on
      # a real run, and a GitHub App installation token is the documented
      # fallback if GitHub still rejects the push.
      GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
      # This repo is a fork and the job adds an `upstream` remote. Without
      # GH_REPO, `gh` resolves the base repo to the PARENT and every API call
      # fails with "Resource not accessible by integration". Pin gh to the fork.
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout flex with full history and tags
        uses: actions/checkout@v6
        with:
          ref: flex
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Configure git and fetch upstream tags
        run: |
          git config user.name 'flex-upstream-sync-bot'
          git config user.email 'flex-upstream-sync-bot@users.noreply.github.com'
          git remote add upstream https://github.com/open-webui/open-webui.git
          # --force: some legacy tags on this fork point at different commits
          # than upstream's (e.g. v0.6.40). Upstream's value always wins when
          # resolving a sync target.
          git fetch upstream --tags --prune --force

      - name: Resolve target tag
        id: target
        env:
          INPUT_TAG: ${{ inputs.target_tag }}
        run: |
          if [ -n "${INPUT_TAG}" ]; then
            TARGET="${INPUT_TAG}"
          else
            # Latest upstream release tag. `grep -v -- -` drops pre-releases
            # (v0.9.6-rc1) and Flexion's own v*-flex.N tags.
            TARGET=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | grep -v -- - | head -n 1)
          fi
          if [ -z "${TARGET}" ] || ! git rev-parse -q --verify "${TARGET}^{commit}" >/dev/null; then
            echo "::error::Target tag '${TARGET}' not found after fetching upstream."
            exit 1
          fi
          echo "Target: ${TARGET}"
          echo "target=${TARGET}" >> "$GITHUB_OUTPUT"

      - name: Resolve current base on flex
        id: base
        run: |
          # Most recent upstream release tag reachable from flex. Flexion's own
          # tags (v0.9.4-flex.2) are excluded so they cannot be mistaken for an
          # upstream base. This works precisely because flex takes releases by
          # MERGE: upstream tags stay real ancestors of flex.
          if BASE=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-*' flex 2>/dev/null); then
            echo "flex is based on ${BASE}"
          else
            BASE=""
            echo "::warning::No upstream release tag is an ancestor of flex. First merge-based sync?"
          fi
          echo "base=${BASE}" >> "$GITHUB_OUTPUT"

      - name: Decide whether to sync
        id: decide
        env:
          TARGET: ${{ steps.target.outputs.target }}
          BASE: ${{ steps.base.outputs.base }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ "${FORCE}" != "true" ] && git merge-base --is-ancestor "${TARGET}" flex; then
            echo "flex already contains ${TARGET}; nothing to do."
            echo "sync=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Guard against syncing backward. Do NOT use `git merge-base
          # --is-ancestor BASE TARGET` for this: upstream does not keep linear
          # tag ancestry (consecutive releases are often siblings off a shared
          # parent), and that test rejected 28 consecutive valid runs in
          # 2026-06. Compare release VERSIONS instead, zero-padded so that
          # v0.9.9 < v0.10.0 orders correctly.
          if [ -n "${BASE}" ] && [ "${FORCE}" != "true" ]; then
            ver_key() { printf '%s' "${1#v}" | awk -F. '{printf "%d%03d%03d", $1, $2, $3}'; }
            if [ "$(ver_key "${TARGET}")" -lt "$(ver_key "${BASE}")" ]; then
              echo "::error::Target ${TARGET} is older than flex's base ${BASE}. Refusing to sync backward. Re-run with force=true to override."
              exit 1
            fi
          fi

          echo "Will sync flex from ${BASE:-<none>} -> ${TARGET}"
          echo "sync=true" >> "$GITHUB_OUTPUT"

      - name: Mirror main from upstream (best effort)
        if: steps.decide.outputs.sync == 'true'
        continue-on-error: true
        run: |
          # Not load-bearing. Keeping `main` as an upstream mirror means the
          # upstream commits this sync merges are already objects on the remote,
          # so pushing the sync branch sends only the merge commit. If GitHub
          # refuses (it does when upstream changed workflow files), the sync
          # still proceeds; the push step reports clearly if that turns out to
          # matter. `main` is NOT this fork's default branch, so a stale mirror
          # breaks nothing else.
          if ! gh api -X POST "repos/${GITHUB_REPOSITORY}/merge-upstream" -f branch=main; then
            echo "::warning title=main not mirrored::GitHub would not sync main with this token. Open ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/tree/main and click 'Sync fork' if the push below fails."
          fi

      - name: Create sync branch
        if: steps.decide.outputs.sync == 'true'
        id: branch
        env:
          TARGET: ${{ steps.target.outputs.target }}
        run: |
          BRANCH="upstream-sync/${TARGET}-$(date -u +%Y%m%d-%H%M%S)"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          git checkout -b "${BRANCH}"

      - name: Merge the release
        if: steps.decide.outputs.sync == 'true'
        id: merge
        env:
          TARGET: ${{ steps.target.outputs.target }}
        run: |
          scripts/upstream-sync.sh merge "${TARGET}"
          git show --remerge-diff HEAD > "${OUT_DIR}/remerge.diff" || true
          echo "manual_count=$(wc -l < "${OUT_DIR}/manual-review.txt" | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Verify nothing Flexion-owned was lost
        if: steps.decide.outputs.sync == 'true'
        id: verify
        continue-on-error: true
        env:
          TARGET: ${{ steps.target.outputs.target }}
        run: scripts/upstream-sync.sh verify "${TARGET}" 2>&1 | tee "${OUT_DIR}/verify.log"

      - name: Upload sync logs
        if: always() && steps.decide.outputs.sync == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: upstream-sync-${{ steps.target.outputs.target }}
          path: ${{ github.workspace }}/.upstream-sync-out
          if-no-files-found: ignore

      - name: Push the sync branch
        if: steps.decide.outputs.sync == 'true'
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
          TARGET: ${{ steps.target.outputs.target }}
        run: |
          if git push -u origin "$BRANCH"; then
            exit 0
          fi
          # A workflow command is only recognised at the very start of a line,
          # so this is echoed rather than written as an indented heredoc.
          echo "::error title=Push rejected::Could not push ${BRANCH}. If the message above mentions workflow files, GitHub is refusing this token a push touching .github/workflows. The merge does not change that directory, so the cause is upstream commits new to this remote. Fix: open ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/tree/main and click 'Sync fork', then re-run; or add a SYNC_TOKEN secret (GitHub App installation token, or fine-grained PAT with Contents write + Pull requests write + Workflows write) and re-run. To reproduce locally: git switch -c ${BRANCH} origin/flex && scripts/upstream-sync.sh merge ${TARGET}"
          exit 1

      - name: Open the draft PR
        if: steps.decide.outputs.sync == 'true'
        id: pr
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
          MANUAL_COUNT: ${{ steps.merge.outputs.manual_count }}
          VERIFY: ${{ steps.verify.outcome }}
          TARGET: ${{ steps.target.outputs.target }}
          BASE: ${{ steps.base.outputs.base }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          BODY_FILE=$(mktemp)
          {
            echo "Merges upstream **${TARGET}** into \`flex\` (previous base: **${BASE:-<none>}**)."
            echo ""
            echo "> [!IMPORTANT]"
            echo "> This PR is **not finished**. CI prepared the merge; a human finishes it."
            echo "> Merge it with **Create a merge commit** — squash or rebase would strip"
            echo "> upstream's history from \`flex\` and make the next sync re-resolve everything."
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Files needing human resolution | ${MANUAL_COUNT} |"
            echo "| \`upstream-sync.sh verify\` in CI | ${VERIFY} |"
            echo "| Run log and remerge diff | [artifact](${RUN_URL}) |"
            echo ""
            echo "## Finish this sync"
            echo ""
            echo '```bash'
            echo "git fetch origin && git fetch upstream --tags --prune --force"
            echo "git switch ${BRANCH}"
            echo "# resolve the files listed in the merge commit message, then commit"
            echo "scripts/upstream-sync.sh verify ${TARGET}"
            echo '```'
            echo ""
            echo "- [ ] All conflict markers resolved; \`upstream-sync.sh verify\` passes locally"
            echo "- [ ] \`npm run build\` succeeds"
            echo "- [ ] \`docker build .\` succeeds"
            echo "- [ ] Provider icons, Google OAuth Groups + admin exemption, and the Alembic chain still behave"
            echo "- [ ] Mark ready for review"
            echo ""
            cat "${OUT_DIR}/conflict-resolution-log.md"
            echo ""
            echo "<details><summary>verify output</summary>"
            echo ""
            echo '```'
            cat "${OUT_DIR}/verify.log" 2>/dev/null || echo "(verify did not run)"
            echo '```'
            echo ""
            echo "</details>"
            echo ""
            echo "<details><summary>Flexion's diff against ${TARGET} after this merge</summary>"
            echo ""
            echo '```'
            git diff --stat=120 "${TARGET}" HEAD | tail -n 200
            echo '```'
            echo ""
            echo "</details>"
          } > "$BODY_FILE"

          # Always a draft. A sync is never certified by CI alone: `verify`
          # proves nothing was silently dropped, not that the result builds or
          # that the resolutions are semantically right.
          gh pr create \
            --draft \
            --base flex \
            --head "$BRANCH" \
            --title "chore: upstream-sync flex onto ${TARGET}" \
            --body-file "$BODY_FILE"

      - name: Request review (best effort)
        if: steps.decide.outputs.sync == 'true'
        continue-on-error: true
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          # Team review requests need org-level access that the default
          # GITHUB_TOKEN does not reliably have, and a 422 here must not fail an
          # otherwise good sync.
          gh pr edit "$BRANCH" --add-reviewer flexion/opencode

      - name: Fail the run if verify failed
        if: steps.decide.outputs.sync == 'true' && steps.verify.outcome == 'failure'
        run: |
          echo "::error::scripts/upstream-sync.sh verify failed. The draft PR is open, but the merge dropped Flexion work or still carries conflict markers. See the PR body and the run artifact."
          exit 1
